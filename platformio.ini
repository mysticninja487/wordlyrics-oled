; Word-by-word lyrics on an SSD1306 OLED, driven by an ESP32.
;
; Build/flash:  pio run -e esp32dev -t upload
; Serial log:   pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.0

; Classic ESP32 DevKit V1 (30-pin). I2C: SDA=GPIO21, SCL=GPIO22.
[env:esp32dev]
board = esp32dev
build_flags =
    -DOLED_SDA=21
    -DOLED_SCL=22

; ESP32-C3 boards (e.g. ESP32-C3 Pro Mini). I2C pins differ between board
; makers: check YOUR board's pinout and edit OLED_SDA / OLED_SCL below.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOLED_SDA=8
    -DOLED_SCL=9
